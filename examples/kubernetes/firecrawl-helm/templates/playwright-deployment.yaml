apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "firecrawl.fullname" . }}-playwright
  labels:
    app: {{ include "firecrawl.name" . }}-playwright
spec:
  replicas: {{ .Values.playwright.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "firecrawl.name" . }}-playwright
  template:
    metadata:
      labels:
        app: {{ include "firecrawl.name" . }}-playwright
    spec:
      {{- if .Values.image.dockerSecretEnabled }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: playwright-service
          image: "{{ .Values.playwright.repository }}:{{ .Values.playwright.tag }}"
          imagePullPolicy: {{ .Values.playwright.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.playwright.port }}
          envFrom:
            - configMapRef:
                name: {{ include "firecrawl.fullname" . }}-config
            - secretRef:
                name: {{ include "firecrawl.fullname" . }}-secret
            - configMapRef:
                name: {{ include "firecrawl.fullname" . }}-playwright-config
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.playwright.port }}
            # Launching a Camoufox pool (and any GeoIP lookups) is slow, so allow
            # a generous window before declaring the pod dead.
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.playwright.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.playwright.resources.requests.cpu | default "500m" }}
              memory: {{ .Values.playwright.resources.requests.memory | default "2Gi" }}
            limits:
              cpu: {{ .Values.playwright.resources.limits.cpu | default "2000m" }}
              memory: {{ .Values.playwright.resources.limits.memory | default "4Gi" }}
